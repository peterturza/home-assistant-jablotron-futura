services:
  homeassistant:
    container_name: ha-jablotron-dev
    # Override to test another release: HA_VERSION=2025.1 docker compose up -d
    image: homeassistant/home-assistant:${HA_VERSION:-2026.11}
    volumes:
      - ./dev-config:/config
      - ./custom_components:/config/custom_components
    ports:
      - "8123:8123"
    restart: unless-stopped
